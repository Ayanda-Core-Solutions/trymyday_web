  <link rel="manifest" href="manifest.json">
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://trymyday.co.za/#organization",
          "name": "TryMyDay",
          "url": "https://trymyday.co.za/",
          "logo": "https://trymyday.co.za/icons/Icon-512.png",
          "description": "TryMyDay connects people with experienced professionals for practical career guidance and real conversations.",
          "areaServed": {"@type": "Country", "name": "South Africa"},
          "email": "hello@trymyday.co.za"
        },
        {
          "@type": "WebSite",
          "@id": "https://trymyday.co.za/#website",
          "url": "https://trymyday.co.za/",
          "name": "TryMyDay",
          "publisher": {"@id": "https://trymyday.co.za/#organization"},
          "inLanguage": "en-ZA"
        }
      ]
    }
  </script>
  <script src="/seo_runtime.js"></script>
  <style>
    :root {
      --trymyday-primary: #165a56;
      --trymyday-secondary: #e1e754;
      --trymyday-background: #f8f8f2;
      --trymyday-surface: #ffffff;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--trymyday-background);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    body {
      overflow: hidden;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--trymyday-background);
      opacity: 1;
      visibility: visible;
      transition: opacity 220ms ease, visibility 220ms ease;
    }

    #app-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      padding: 24px;
      text-align: center;
    }

    .loader-brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--trymyday-primary);
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.8px;
      line-height: 1;
    }

    .loader-mark {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 14px;
      background: var(--trymyday-primary);
    }

    .loader-mark img {
      display: block;
      width: 29px;
      height: 25px;
      filter: brightness(0) invert(1);
    }

    .loader-tagline {
      margin: 20px 0 0;
      color: var(--trymyday-text-muted, #56706d);
      font-size: 15px;
      line-height: 1.4;
    }

    .loader-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
    }

    .loader-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--trymyday-primary);
      animation: trymyday-pulse 1.2s ease-in-out infinite;
    }

    .loader-dot:nth-child(2) {
      animation-delay: 140ms;
    }

    .loader-dot:nth-child(3) {
      animation-delay: 280ms;
    }

    @keyframes trymyday-pulse {
      0%, 70%, 100% {
        opacity: 0.25;
        transform: translateY(0);
      }
      35% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-dot {
        animation: none;
        opacity: 0.55;
      }
    }
  </style>
</head>
<body>
  <main id="homepage-seo-content" class="visually-hidden">
    <h1>Career guidance from experienced professionals</h1>
    <p>Book honest career conversations, free coffee chats, and focused one-on-one sessions with experienced professionals on TryMyDay.</p>
  </main>
  <div id="app-loader" role="status" aria-live="polite" aria-label="Loading TryMyDay">
    <div class="loader-content">
      <div class="loader-brand">
        <span class="loader-mark">
          <img src="favicon.svg" alt="TryMyDay logo">
        </span>
        <span>TryMyDay</span>
      </div>
      <p class="loader-tagline">Guidance that gets you there.</p>
      <div class="loader-dots" aria-hidden="true">
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
        <span class="loader-dot"></span>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('app-loader');
      const seoContent = document.getElementById('seo-content');
      if (seoContent) {
        seoContent.remove();
      }
      if (loader) {
        loader.classList.add('is-hidden');
        window.setTimeout(function () {
          loader.remove();
          document.body.style.overflow = '';
        }, 260);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
